<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daymark · 单日重要事项与待办箱</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      :root {
        --background-primary: #171c1e;
        --background-secondary: #202629;
        --background-modifier-border: #343b41;
        --background-modifier-hover: #272e34;
        --text-normal: #d6d6d6;
        --text-muted: #b5bdc8;
        --text-error: #ff737f;
        --interactive-accent: #4285df;
        --font-interface: system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #171c1e;
        color: var(--text-normal);
        font:
          14px system-ui,
          sans-serif;
      }
      main {
        max-width: 704px;
        margin: 0 auto;
      }
      #calendar {
        width: 100%;
      }
      #timer {
        border-top: 1px solid var(--background-modifier-border);
        margin-top: 22px;
      }
      input,
      select,
      button {
        font: inherit;
        border: 1px solid #444c56;
        border-radius: 5px;
        padding: 6px 10px;
        color: inherit;
        background: #22292e;
      }
      button {
        cursor: pointer;
      }
      button.mod-cta {
        background: #4285df;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="calendar"></div>
      <div id="timer"></div>
    </main>
    <script src="preview.js"></script>
  </body>
</html>
